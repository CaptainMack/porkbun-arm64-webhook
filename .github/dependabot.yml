version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Kubernetes libraries must match the minor cert-manager is built against
      # (mixed minors break the webhook API server); bump them together with
      # cert-manager by hand. Patch releases are still proposed.
      - dependency-name: "k8s.io/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*", "github.com/cert-manager/*"]
      go-deps:
        patterns: ["*"]
        exclude-patterns: ["k8s.io/*", "sigs.k8s.io/*", "github.com/cert-manager/*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
