apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "porkbun-webhook.fullname" . }}
  labels:
    app: {{ include "porkbun-webhook.name" . }}
    chart: {{ include "porkbun-webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
---
# Grant the webhook permission to read the ConfigMap containing the Kubernetes
# apiserver's requestheader-ca-certificate.
# This ConfigMap is automatically created by the Kubernetes apiserver.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "porkbun-webhook.fullname" . }}:webhook-authentication-reader
  namespace: kube-system
  labels:
    app: {{ include "porkbun-webhook.name" . }}
    chart: {{ include "porkbun-webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "porkbun-webhook.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# apiserver gets the auth-delegator role to delegate auth decisions to
# the core apiserver
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "porkbun-webhook.fullname" . }}:auth-delegator
  labels:
    app: {{ include "porkbun-webhook.name" . }}
    chart: {{ include "porkbun-webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "porkbun-webhook.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Grant cert-manager permission to call the solver. cert-manager POSTs to the
# resource named after the solver ("porkbun") — nothing else in the group.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "porkbun-webhook.fullname" . }}:domain-solver
  labels:
    app: {{ include "porkbun-webhook.name" . }}
    chart: {{ include "porkbun-webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
rules:
  - apiGroups:
      - {{ .Values.groupName }}
    resources:
      - porkbun
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "porkbun-webhook.fullname" . }}:domain-solver
  labels:
    app: {{ include "porkbun-webhook.name" . }}
    chart: {{ include "porkbun-webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "porkbun-webhook.fullname" . }}:domain-solver
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ .Values.certManager.serviceAccountName }}
    namespace: {{ .Values.certManager.namespace }}
---
# Read access to the Porkbun credentials only: named secrets, one namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "porkbun-webhook.fullname" . }}:credentials-reader
  namespace: {{ .Values.credentials.namespace }}
  labels:
    app: {{ include "porkbun-webhook.name" . }}
    chart: {{ include "porkbun-webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
{{ toYaml .Values.credentials.secretNames | indent 6 }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "porkbun-webhook.fullname" . }}:credentials-reader
  namespace: {{ .Values.credentials.namespace }}
  labels:
    app: {{ include "porkbun-webhook.name" . }}
    chart: {{ include "porkbun-webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "porkbun-webhook.fullname" . }}:credentials-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "porkbun-webhook.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# The embedded API server watches API Priority and Fairness objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "porkbun-webhook.fullname" . }}:flowcontrol-reader
  labels:
    app: {{ include "porkbun-webhook.name" . }}
    chart: {{ include "porkbun-webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
rules:
  - apiGroups: ["flowcontrol.apiserver.k8s.io"]
    resources: ["prioritylevelconfigurations", "flowschemas"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "porkbun-webhook.fullname" . }}:flowcontrol-reader
  labels:
    app: {{ include "porkbun-webhook.name" . }}
    chart: {{ include "porkbun-webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "porkbun-webhook.fullname" . }}:flowcontrol-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "porkbun-webhook.fullname" . }}
    namespace: {{ .Release.Namespace }}
