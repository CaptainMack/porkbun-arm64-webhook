# API group the webhook registers under. Must be unique to you (use a domain you
# own) and must match `groupName` in every Issuer/ClusterIssuer that uses it.
# Required — the chart refuses to render without it.
groupName: ""

certManager:
  namespace: cert-manager
  serviceAccountName: cert-manager

# Secret(s) holding the Porkbun API key / secret API key that Issuers reference
# via apiKeySecretRef / secretKeySecretRef. The webhook may read only these
# names, and only in `credentialsNamespace` (where cert-manager resolves secrets
# for ClusterIssuers — its "cluster resource namespace").
credentials:
  namespace: cert-manager
  secretNames:
    - porkbun-credentials

image:
  repository: ghcr.io/captainmack/porkbun-arm64-webhook
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# The container runs as non-root, so it listens on an unprivileged port; the
# Service still exposes 443 to the Kubernetes API server.
securePort: 8443

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 443

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
